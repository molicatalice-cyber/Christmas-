<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>聖誕刮刮樂</title>
<style>
  :root { --red:#b0363f; --deep:#85161f; --cream:#fbefe6; --green:#3f6b4a; --gold:#ffd664; --ink:#5a1a20; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; }
  body {
    background:var(--red); color:var(--cream);
    font-family:"Hiragino Maru Gothic ProN","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100dvh; padding:24px 16px; text-align:center; overflow-x:hidden;
  }
  h1 { font-size:26px; letter-spacing:.2em; margin:0 0 6px; font-weight:700; }
  .sub { font-size:14px; opacity:.85; margin:0 0 22px; }
  .card {
    position:relative; width:min(86vw,340px); aspect-ratio:1/1; border-radius:22px;
    background:var(--cream); color:var(--ink);
    box-shadow:0 0 0 4px var(--cream), 0 0 0 7px var(--green), 0 14px 30px rgba(0,0,0,.25);
    overflow:hidden; container-type:inline-size; touch-action:none; user-select:none; -webkit-user-select:none;
  }
  .result { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4cqw; }
  .luck { font-size:15px; letter-spacing:.3em; color:var(--cream); background:var(--red); padding:4px 14px 4px 18px; border-radius:99px; }
  .emoji { font-size:54px; height:54px; margin:12px 0 10px; line-height:1; }
  .text { font-size:min(18px,5.2cqw); line-height:1.7; font-weight:700; white-space:pre; }
  canvas { position:absolute; inset:0; width:100%; height:100%; transition:opacity .6s; }
  canvas.done { opacity:0; pointer-events:none; }
  button {
    margin-top:26px; font:inherit; font-size:15px; color:var(--cream); background:transparent;
    border:2px solid var(--cream); border-radius:99px; padding:9px 22px; cursor:pointer;
    opacity:0; pointer-events:none; transition:opacity .4s;
  }
  button.show { opacity:1; pointer-events:auto; }
  button:active { background:rgba(255,255,255,.15); }
  .snow { position:fixed; top:-20px; color:#fff; opacity:.7; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(360deg); } }
  .snow.gold { color:var(--gold); opacity:1; text-shadow:0 0 6px rgba(255,214,100,.8); }
  .card.ssr { animation:ssr 3s ease-out; }
  .card.ssr::after { content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(115deg,transparent 30%,rgba(255,236,160,.95) 50%,transparent 70%);
    background-size:300% 100%; animation:shine 1.1s ease-out 2; }
  @keyframes ssr {
    0% { box-shadow:0 0 0 4px var(--cream),0 0 0 7px var(--gold),0 0 0 0 rgba(255,214,100,.9); background:#ffe9a8; }
    12% { box-shadow:0 0 0 4px var(--cream),0 0 0 7px var(--gold),0 0 70px 30px rgba(255,214,100,.95); background:#fff6d6; }
    80% { box-shadow:0 0 0 4px var(--cream),0 0 0 7px var(--gold),0 0 40px 12px rgba(255,214,100,.6); background:var(--cream); }
    100% { background:var(--cream); }
  }
  @keyframes shine { from { background-position:120% 0; } to { background-position:-60% 0; } }
  .confetti { position:fixed; width:8px; height:14px; border-radius:2px; pointer-events:none; z-index:5;
    animation:burst ease-out forwards; }
  @keyframes burst {
    0% { transform:translate(-50%,-50%) rotate(0); opacity:1; }
    60% { opacity:1; }
    100% { transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 260px)) rotate(var(--rot)); opacity:0; }
  }
  @media (prefers-reduced-motion:reduce){ .snow,.confetti{display:none} .card.ssr,.card.ssr::after{animation:none} }
</style>
</head>
<body>
  <h1>聖誕刮刮樂</h1>
  <p class="sub">用手指刮開，看看今天的籤</p>
  <div class="card" id="card">
    <div class="result">
      <div class="luck" id="luck"></div>
      <div class="emoji" id="emoji"></div>
      <div class="text" id="text"></div>
    </div>
    <canvas id="cv" aria-label="刮刮樂塗層"></canvas>
  </div>
  <button id="again">再刮一張</button>

<script>
const FORTUNES = [
  ["大吉", "🦌", "一鹿順風。"],
  ["大吉", "🎅", "聖誕老人為什麼每年遲到？\n因為麋鹿都在迷路。"],
  ["大吉", "🦌", "麋鹿為什麼不會說謊？\n因為牠很鹿實。\n（本梗未通過諧音認證，仍堅持上架）"],
  ["大吉", "☔", "聖誕老人最怕什麼天氣？\n下襪子雨。\n（審核員已下班）"],
  ["大吉", "⛄", "你刮太大力了。\n我沒事。\n繼續。"],
  ["大吉（心虛）", "", "這張沒有想到梗。\n但你都刮了。\n大吉。"],
  ["大吉", "🎄", "這張的笑點在第三行。\n\n……抱歉，它沒有來。"],
  ["大吉", "✨", "刮得真乾淨。\n你很擅長這個。\n這不是什麼有用的技能，但你很擅長。"],
  ["大吉", "🔮", "今日預言：\n你會在下午\n突然想吃一個東西。"],
  ["大吉", "🎉", "本刮刮樂共十六種結果。\n全部都是大吉。這張也是。\n恭喜！！！"],
  ["大吉", "🧦", "今日幸運物：左腳的襪子。\n牠不知道自己是幸運物。\n請保密。"],
  ["大吉", "🎟️", "本券可兌換：本券。\n你已持有本券，兌換完成。\n恭喜！！！"],
  ["大吉", "🛷", "聖誕老人的雪橇驗車沒過。\n他改搭高鐵，行李是一個很大的袋子。\n沒有人敢問。"],
  ["大吉", "🐧", "北極沒有企鵝。\n但這張有。\n牠是自己走來的，牠也不知道為什麼。"],
  ["大吉", "🍪", "薑餅人今日運勢：凶。\n跟你沒關係。\n牠叫我跟你說一聲而已。"],
  ["大吉（真）", "⭐", "這張真的是大吉。\n不要跟其他張說。"],
];
const RARE = FORTUNES.length - 1;                       // 最後一張是稀有卡
const WEIGHTS = FORTUNES.map((_, i) => i === RARE ? 1 / 3 : 1);
const FORCE_RARE = new URLSearchParams(location.search).has('ssr');   // 測試用：網址加 ?ssr

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const card = document.getElementById('card'), again = document.getElementById('again');
let last = -1, revealed = false, drawing = false, prev = null, moves = 0, goldUntil = 0;

function pick() {
  let i;
  do {
    let r = Math.random() * WEIGHTS.reduce((a, b) => a + b, 0);
    for (i = 0; i < WEIGHTS.length - 1 && (r -= WEIGHTS[i]) >= 0; i++);
  } while (i === last);
  if (FORCE_RARE && last === -1) i = RARE;
  last = i;
  const [luck, emoji, text] = FORTUNES[i];
  document.getElementById('luck').textContent = luck;
  document.getElementById('emoji').textContent = emoji;
  document.getElementById('text').textContent = text;
}
function paint() {
  if (revealed) return;
  const r = card.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
  if (!r.width || !r.height) return;
  cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  const g = ctx.createLinearGradient(0, 0, r.width, r.height);
  g.addColorStop(0, '#e9c46a'); g.addColorStop(.5, '#ffe9a8'); g.addColorStop(1, '#d9a94a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, r.width, r.height);
  ctx.fillStyle = 'rgba(133,22,31,.16)'; ctx.font = '20px serif'; ctx.textAlign = 'center';
  for (let y = 26, row = 0; y < r.height + 20; y += 44, row++)
    for (let x = (row % 2 ? 22 : 0); x < r.width + 20; x += 52) ctx.fillText(row % 2 ? '✦' : '❄', x + 14, y);
  ctx.fillStyle = '#85161f'; ctx.font = '700 22px "PingFang TC","Noto Sans TC",sans-serif';
  ctx.fillText('刮 這 裡', r.width / 2, r.height / 2 + 8);
  ctx.globalCompositeOperation = 'destination-out';
  ctx.lineCap = ctx.lineJoin = 'round'; ctx.lineWidth = 46;
  moves = 0;
}
function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function scratch(p) {
  ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke();
  ctx.beginPath(); ctx.arc(p.x, p.y, 23, 0, Math.PI * 2); ctx.fill();
  prev = p;
  if (++moves % 8 === 0) check();
}
function check() {
  if (revealed || !cv.width || !cv.height) return;
  const s = 16, w = cv.width, h = cv.height, data = ctx.getImageData(0, 0, w, h).data;
  let clear = 0, total = 0;
  for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s) { total++; if (data[(y * w + x) * 4 + 3] < 40) clear++; }
  if (clear / total > 0.5) reveal();
}
function reveal() {
  revealed = true; cv.classList.add('done'); again.classList.add('show');
  if (last === RARE) rare();
  else for (let i = 0; i < 26; i++) setTimeout(flake, i * 90);
}
function flake() {
  const s = document.createElement('span'); s.className = 'snow'; s.textContent = '❄';
  if (Date.now() < goldUntil) s.classList.add('gold');
  s.style.left = Math.random() * 100 + 'vw'; s.style.fontSize = 10 + Math.random() * 16 + 'px';
  s.style.animationDuration = 3 + Math.random() * 3 + 's';
  document.body.appendChild(s); s.addEventListener('animationend', () => s.remove());
}
function rare() {                                       // 稀有卡：金光、彩帶、金色雪花，約 3 秒
  goldUntil = Date.now() + 3000;
  card.classList.add('ssr'); setTimeout(() => card.classList.remove('ssr'), 3000);
  document.querySelectorAll('.snow').forEach(s => s.classList.add('gold'));
  for (let i = 0; i < 45; i++) setTimeout(flake, i * 60);
  const r = card.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ['#ffd664', '#fbefe6', '#3f6b4a', '#ff8a8a', '#f3b63f', '#9ad0a5'];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement('span'); c.className = 'confetti';
    const a = Math.random() * Math.PI * 2, dist = 120 + Math.random() * 260;
    c.style.left = cx + 'px'; c.style.top = cy + 'px';
    c.style.background = colors[i % colors.length];
    c.style.setProperty('--dx', Math.cos(a) * dist + 'px');
    c.style.setProperty('--dy', Math.sin(a) * dist - 80 + 'px');
    c.style.setProperty('--rot', (Math.random() * 1080 - 540) + 'deg');
    c.style.animationDuration = 1.6 + Math.random() * 1.4 + 's';
    c.style.animationDelay = Math.random() * .25 + 's';
    document.body.appendChild(c); c.addEventListener('animationend', () => c.remove());
  }
}
cv.addEventListener('pointerdown', e => {
  if (cv.width === 0) paint();
  drawing = true; prev = pos(e);
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  scratch(prev);
});
cv.addEventListener('pointermove', e => { if (drawing) scratch(pos(e)); });
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { drawing = false; check(); }));
again.addEventListener('click', () => { revealed = false; again.classList.remove('show'); pick(); paint(); cv.classList.remove('done'); });
window.addEventListener('resize', paint);
window.addEventListener('load', paint);
pick();
requestAnimationFrame(paint);
</script>
</body>
</html>
